[package]
name = "http-request-tool"
version = "0.1.0"
description = "Portable lightweight HTTP request debug tool (like a mini Postman)"
edition = "2024"

[dependencies]
eframe = "0.29"
egui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "multipart", "native-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
anyhow = "1"
rfd = "0.15"
url = "2"
base64 = "0.22"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
